name: Static checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: python -m compileall -q app.py bootstrap.py benchmark.py smoke_test.py local_ai

      - name: Validate JSON
        run: |
          python -m json.tool config.json > /dev/null
          python -m json.tool model_profiles.json > /dev/null

      - name: Validate model profiles
        run: python bootstrap.py --list-profiles

      - name: Resolve every model profile through runtime settings
        run: |
          python - <<'PY'
          from local_ai.profiles import load_profiles, resolve_model_config

          profiles = load_profiles()
          for name in profiles:
              resolved = resolve_model_config({"model": {"profile": name}}, profiles)
              print(f"{name}: {resolved['quantization']}")
          PY
